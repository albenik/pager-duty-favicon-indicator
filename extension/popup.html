<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PagerDuty Signal</title><link rel="stylesheet" href="styles.css"></head>
<body class="popup-page">
  <header class="popup-header"><div class="brand"><img src="icons/icon32.png" width="32" height="32" alt=""><span>Signal<span class="brand-sub">FOR PAGERDUTY</span></span></div><button id="settings" class="icon-button" type="button" aria-label="Open extension settings" title="Settings">⚙</button></header>
  <main class="popup-main"><div class="popup-status"><canvas id="status-icon" width="64" height="64"></canvas><div><div class="eyebrow" id="status-eyebrow">YOUR INCIDENTS</div><h1 id="status-title">Not connected</h1></div></div><p id="status-description">Connect your PagerDuty account to start monitoring.</p><div id="counts" class="counts hidden"><div><strong id="triggered-count">0</strong><span>Triggered</span></div><div><strong id="ack-count">0</strong><span>Acknowledged</span></div></div><div class="popup-meta"><div><span>Watching</span><strong id="scope-label">Assigned to me</strong></div><div><span>User</span><strong id="tracked-user">—</strong></div><div><span>Refresh</span><strong id="refresh-label">Every minute</strong></div></div><p id="checked-at" class="small muted">No successful checks yet</p><p id="popup-error" class="feedback error" role="status" aria-live="polite"></p><div class="popup-actions"><button id="refresh" type="button" class="button secondary">Refresh ↻</button><button id="open-pagerduty" type="button" class="button primary">Open PagerDuty <svg class="external-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18 18 6M7 6h11v11"/></svg></button></div><button id="setup" class="button primary hidden" type="button">Connect PagerDuty <svg class="external-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18 18 6M7 6h11v11"/></svg></button></main>
  <footer class="popup-footer"><span class="tiny-dot"></span><span id="popup-footer-text">Private. Local. Yours.</span><button class="text-button" id="pause" type="button">Pause</button></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
